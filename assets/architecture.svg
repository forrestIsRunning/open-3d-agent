<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-label="You to Desktop to Host; Host makes the mesh; Codex LLM talks only">
  <style>
    .box { fill: #161a22; stroke: #3a4254; stroke-width: 1.5; }
    .you { fill: #1e3a2f; stroke: #3dd68c; }
    .llm { fill: #2a2418; stroke: #f4a261; }
    .t { font: 600 14px ui-sans-serif, system-ui, sans-serif; fill: #e8ecf3; }
    .s { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #8b95a7; }
    .arr { stroke: #5b6b88; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5b6b88"/>
    </marker>
  </defs>
  <rect class="box you" x="16" y="78" width="120" height="72" rx="10"/>
  <text class="t" x="76" y="110" text-anchor="middle">You</text>
  <text class="s" x="76" y="128" text-anchor="middle">chat · files</text>
  <path class="arr" d="M144,114 H196"/>
  <rect class="box" x="204" y="62" width="168" height="104" rx="10"/>
  <text class="t" x="288" y="100" text-anchor="middle">Desktop</text>
  <text class="s" x="288" y="120" text-anchor="middle">Electron · Vue · Three</text>
  <text class="s" x="288" y="138" text-anchor="middle">stage + filmstrip</text>
  <path class="arr" d="M372,114 H424"/>
  <rect class="box" x="432" y="40" width="176" height="80" rx="10"/>
  <text class="t" x="520" y="72" text-anchor="middle">Host</text>
  <text class="s" x="520" y="92" text-anchor="middle">owns tools, not the LLM</text>
  <path class="arr" d="M520,120 V148"/>
  <rect class="box llm" x="432" y="148" width="176" height="56" rx="10"/>
  <text class="t" x="520" y="172" text-anchor="middle">Codex · LLM</text>
  <text class="s" x="520" y="190" text-anchor="middle">talk / check · workspace_*</text>
  <path class="arr" d="M608,80 H662"/>
  <rect class="box" x="670" y="24" width="230" height="192" rx="10"/>
  <text class="t" x="785" y="56" text-anchor="middle">Make the mesh</text>
  <text class="s" x="785" y="86" text-anchor="middle">Tripo → generate / edit</text>
  <text class="s" x="785" y="106" text-anchor="middle">Blender → scale / holes / plaza</text>
  <text class="s" x="785" y="138" text-anchor="middle">commitModel</text>
  <text class="s" x="785" y="158" text-anchor="middle">lab-family_N.glb</text>
  <text class="s" x="785" y="178" text-anchor="middle">back on stage</text>
</svg>
